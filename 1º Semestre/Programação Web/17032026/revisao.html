<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="estilo.css">
    <style>
        p {
            color: red;
        }
        .texto{
            color: darkviolet;
        }
        #titulo{
            font-family: Arial;
            font-size: 40px;
            font-style: italic;
        }
    </style>
  </head>
  <body>
    <!-- Seletor por TAG -->
    <p>Parágrafo estilizado por tag</p>
    <p>Parágrafo estilizado por tag 2</p>

    <!-- Seletor por classe: classificação -->
    <p class="texto">Parágrafo estilizado por classe</p>
    <h2 class="texto">Título 2 estilizado por classe</h2>
    <h1 class="texto">Título 1 estilizado por classe</h1>

    <!-- Seletor por ID: identificador (único na página) -->
    <h1 id="titulo">Título</h1>
  </body>
</html>
