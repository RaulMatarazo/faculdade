<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudoclasse</title>
    <link rel="stylesheet" href="pseudoclasse.css">
</head>
<body>
    <!-- lista não ordenada - unordered list -->
    <ul>
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
    </ul>
    <ol>
        <li>Item 1</li>
        <li>Item 1</li>
        <li>Item 1</li>
    </ol>
    <button class="botao-padrao">Botão</button>

    <div id="div-principal">
        <div class="div-secundaria">1</div>
        <div class="div-secundaria">2</div>
        <div class="div-secundaria">3</div>
    </div>
</body>
</html>
